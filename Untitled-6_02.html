<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Practical Grade Calculator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #111827;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5srem;
            color: #4b5563;
        }

        input {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .results {
            margin-top: 2rem;
            border-top: 1px solid #e5e7eb;
            padding-top: 1.5rem;
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .result-item span {
            font-weight: 600;
        }

        .grade-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: bold;
            color: white;
        }

        .pass { background-color: #10b981; }
        .fail { background-color: #ef4444; }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Practical Grade Calculator</h2>
        
        <div class="input-group">
            <label for="lab1">Lab Practical 1 (out of 100)</label>
            <input type="number" id="lab1" min="0" max="100" placeholder="Enter marks">
        </div>

        <div class="input-group">
            <label for="lab2">Lab Practical 2 (out of 100)</label>
            <input type="number" id="lab2" min="0" max="100" placeholder="Enter marks">
        </div>

        <div class="input-group">
            <label for="viva">Viva / Oral Exam (out of 100)</label>
            <input type="number" id="viva" min="0" max="100" placeholder="Enter marks">
        </div>

        <button onclick="calculateGrade()">Calculate Result</button>

        <div class="results" id="resultsSection">
            <div class="result-item">
                Total Marks: <span id="totalMarks">-</span>
            </div>
            <div class="result-item">
                Percentage: <span id="percentage">-</span>
            </div>
            <div class="result-item">
                Grade: <span id="gradeBadge" class="grade-badge">-</span>
            </div>
        </div>
    </div>

    <script>
        function calculateGrade() {
            const lab1 = parseFloat(document.getElementById('lab1').value) || 0;
            const lab2 = parseFloat(document.getElementById('lab2').value) || 0;
            const viva = parseFloat(document.getElementById('viva').value) || 0;

            const totalMarks = lab1 + lab2 + viva;
            const percentage = (totalMarks / 300) * 100;

            let gradeText = '';
            let gradeClass = '';

            if (percentage >= 85) { gradeText = 'A (Excellent)'; gradeClass = 'pass'; }
            else if (percentage >= 70) { gradeText = 'B (Good)'; gradeClass = 'pass'; }
            else if (percentage >= 50) { gradeText = 'C (Average)'; gradeClass = 'pass'; }
            else if (percentage >= 40) { gradeText = 'D (Pass)'; gradeClass = 'pass'; }
            else { gradeText = 'F (Fail)'; gradeClass = 'fail'; }

            document.getElementById('totalMarks').innerText = `${totalMarks.toFixed(1)} / 300`;
            document.getElementById('percentage').innerText = `${percentage.toFixed(2)}%`;
            
            const badge = document.getElementById('gradeBadge');
            badge.innerText = gradeText;
            badge.className = `grade-badge ${gradeClass}`;

            document.getElementById('resultsSection').style.display = 'block';
        }
    </script>
</body>
</html>
